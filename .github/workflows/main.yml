name: A70Q Kernel Build

on:
  action:

permissions:
  contents: read

jobs:
  build:
    name: Build A70Q Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            lz4 \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      - name: Show kernel version
        run: |
          echo "Kernel source version:"
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)' Makefile

      - name: Prepare build
        run: |
          mkdir -p out

      - name: Build A70Q
        run: |
          export ARCH=arm64

          make O=out a70q_defconfig

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image

      - name: Check kernel
        run: |
          echo "Build output:"
          ls -lh out/arch/arm64/boot/

          test -f out/arch/arm64/boot/Image

      - name: Package kernel
        run: |
          mkdir -p AnyKernel3

          cp out/arch/arm64/boot/Image AnyKernel3/

          cd AnyKernel3
          zip -r ../A70Q-4.14.190-kernel.zip .

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: A70Q-4.14.190-kernel
          path: A70Q-4.14.190-kernel.zip
          retention-days: 7
