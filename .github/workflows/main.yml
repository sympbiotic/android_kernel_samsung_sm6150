name: A70Q Kernel Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build A70Q Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            git \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            lz4 \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi

      - name: Check toolchains
        run: |
          echo "AArch64 GCC:"
          aarch64-linux-gnu-gcc --version

          echo "AArch64 LD:"
          aarch64-linux-gnu-ld --version

          echo "ARM 32-bit GCC:"
          arm-linux-gnueabi-gcc --version

          echo "ARM 32-bit LD:"
          arm-linux-gnueabi-ld --version

      - name: Show kernel version
        run: |
          echo "Kernel source version:"
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)' Makefile

      - name: Prepare output directory
        run: |
          rm -rf out
          mkdir -p out

      - name: Configure A70Q
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          make \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            a70q_defconfig

      - name: Build kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT"

      - name: Check build output
        run: |
          echo "Kernel output:"
          ls -lah out/arch/arm64/boot/

          test -f out/arch/arm64/boot/Image

      - name: Prepare artifact
        run: |
          mkdir -p kernel-artifact

          cp out/arch/arm64/boot/Image \
            kernel-artifact/Image

          cp out/.config \
            kernel-artifact/config

          cp out/include/config/kernel.release \
            kernel-artifact/kernel.release

          tar -czf A70Q-kernel-4.14.190.tar.gz \
            -C kernel-artifact .

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: A70Q-kernel-4.14.190
          path: A70Q-kernel-4.14.190.tar.gz
          retention-days: 7
