name: A70Q Cartel Kernel Build

on:
  push:
    branches:
      - lineage-22.1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Cartel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential \
            libssl-dev libelf-dev \
            libncurses5-dev \
            python3 git curl ccache

      - name: Get Android GCC 4.9
        run: |
          mkdir -p "$GITHUB_WORKSPACE/../PLATFORM/prebuilts/gcc/linux-x86/aarch64"

          git clone --depth=1 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64 \
            "$GITHUB_WORKSPACE/../PLATFORM/prebuilts/gcc/linux-x86/aarch64"

      - name: Check source
        run: |
          echo "Checking defconfig..."
          test -f arch/arm64/configs/a70q_eur_open_defconfig

          echo "Checking Clang..."
          test -x toolchain/llvm-arm-toolchain-ship/10.0/bin/clang

          echo "Checking DTC..."
          test -e tools/dtc

          echo "Source checks passed."

      - name: Configure Cartel
        run: |
          rm -rf out
          mkdir -p out

          make -C "$GITHUB_WORKSPACE" \
            O="$GITHUB_WORKSPACE/out" \
            DTC_EXT="$GITHUB_WORKSPACE/tools/dtc" \
            CONFIG_BUILD_ARM64_DT_OVERLAY=y \
            ARCH=arm64 \
            CROSS_COMPILE="$GITHUB_WORKSPACE/../PLATFORM/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-" \
            REAL_CC="$GITHUB_WORKSPACE/toolchain/llvm-arm-toolchain-ship/10.0/bin/clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            a70q_eur_open_defconfig

      - name: Apply requested kernel config
        run: |
          scripts/config --file out/.config \
            --enable MODULES \
            --enable MODULE_UNLOAD \
            --disable MODULE_SIG_FORCE \
            --disable SAMSUNG_TIMA

          make -C "$GITHUB_WORKSPACE" \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            olddefconfig

          echo "Relevant configuration:"
          grep -E \
            'CONFIG_MODULES=|CONFIG_MODULE_UNLOAD=|CONFIG_MODULE_SIG_FORCE=|CONFIG_SAMSUNG_TIMA=' \
            out/.config || true

      - name: Build kernel
        run: |
          make -j"$(nproc)" \
            -C "$GITHUB_WORKSPACE" \
            O="$GITHUB_WORKSPACE/out" \
            DTC_EXT="$GITHUB_WORKSPACE/tools/dtc" \
            CONFIG_BUILD_ARM64_DT_OVERLAY=y \
            ARCH=arm64 \
            CROSS_COMPILE="$GITHUB_WORKSPACE/../PLATFORM/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-" \
            REAL_CC="$GITHUB_WORKSPACE/toolchain/llvm-arm-toolchain-ship/10.0/bin/clang" \
            CLANG_TRIPLE=aarch64-linux-gnu-

      - name: Verify kernel
        run: |
          test -f out/arch/arm64/boot/Image
          file out/arch/arm64/boot/Image
          echo "Kernel version:"
          make -C "$GITHUB_WORKSPACE" O="$GITHUB_WORKSPACE/out" kernelversion

      - name: Copy Image
        run: |
          cp out/arch/arm64/boot/Image arch/arm64/boot/Image

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: A70Q-Cartel-Image
          path: arch/arm64/boot/Image
