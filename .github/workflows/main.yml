name: A70Q Cartel Kernel Build

on:
  push:
    branches:
      - lineage-22.1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            libelf-dev \
            libncurses5-dev \
            python3 \
            git \
            curl \
            ccache

      - name: Prepare GCC directory
        run: |
          TOOLCHAIN="$GITHUB_WORKSPACE/../PLATFORM/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"

          rm -rf "$TOOLCHAIN"
          mkdir -p "$(dirname "$TOOLCHAIN")"

      - name: Clone preserved GCC 4.9
        run: |
          TOOLCHAIN="$GITHUB_WORKSPACE/../PLATFORM/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"

          git clone \
            --depth=1 \
            --branch android11-release \
            https://gitlab.com/pixelrom/kernel/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git \
            "$TOOLCHAIN"

      - name: Verify GCC
        run: |
          TOOLCHAIN="$GITHUB_WORKSPACE/../PLATFORM/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"

          echo "===== GCC root ====="
          ls -lah "$TOOLCHAIN"

          echo ""
          echo "===== GCC bin ====="
          ls -lah "$TOOLCHAIN/bin"

          GCC="$TOOLCHAIN/bin/aarch64-linux-android-gcc"

          if [ ! -f "$GCC" ]; then
            echo "ERROR: GCC compiler not found:"
            echo "$GCC"

            echo ""
            echo "Searching for compiler:"
            find "$TOOLCHAIN" \
              -type f \
              -name "aarch64-linux-android-gcc" \
              -print

            exit 1
          fi

          chmod +x "$GCC"

          echo ""
          echo "===== GCC version ====="
          "$GCC" --version

      - name: Check kernel source
        run: |
          echo "===== A70Q defconfig ====="

          if [ ! -f "arch/arm64/configs/a70q_defconfig" ]; then
            echo "ERROR: a70q_defconfig not found."

            echo ""
            echo "Available A70 configs:"
            find arch/arm64/configs \
              -maxdepth 1 \
              -type f \
              -iname "*a70*" \
              | sort

            exit 1
          fi

          echo "Found:"
          echo "arch/arm64/configs/a70q_defconfig"

      - name: Check Clang 10
        run: |
          CLANG="$GITHUB_WORKSPACE/toolchain/llvm-arm-toolchain-ship/10.0/bin/clang"

          if [ ! -f "$CLANG" ]; then
            echo "ERROR: Clang 10 not found:"
            echo "$CLANG"
            exit 1
          fi

          chmod +x "$CLANG"

          echo "===== Clang ====="
          "$CLANG" --version

      - name: Check DTC
        run: |
          if [ ! -e "$GITHUB_WORKSPACE/tools/dtc" ]; then
            echo "ERROR: tools/dtc not found."
            exit 1
          fi

          echo "DTC found."

      - name: Prepare output
        run: |
          rm -rf out
          mkdir -p out

      - name: Generate A70Q defconfig
        run: |
          TOOLCHAIN="$GITHUB_WORKSPACE/../PLATFORM/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"
