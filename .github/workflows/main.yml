name: A70Q Cartel Kernel Build

on:
  push:
    branches:
      - lineage-22.1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            libelf-dev \
            libncurses5-dev \
            python3 \
            git \
            curl \
            wget \
            xz-utils \
            ccache \
            zip \
            gcc-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi

      - name: Prepare GCC 4.9 directory
        run: |
          TOOLCHAIN="$GITHUB_WORKSPACE/../PLATFORM/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"

          rm -rf "$TOOLCHAIN"

          mkdir -p "$(dirname "$TOOLCHAIN")"

      - name: Download GCC 4.9
        run: |
          TOOLCHAIN="$GITHUB_WORKSPACE/../PLATFORM/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"

          git clone \
            --depth=1 \
            --branch android11-release \
            https://gitlab.com/pixelrom/kernel/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git \
            "$TOOLCHAIN"

      - name: Verify AArch64 GCC
        run: |
          TOOLCHAIN="$GITHUB_WORKSPACE/../PLATFORM/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"

          GCC="$TOOLCHAIN/bin/aarch64-linux-android-gcc"

          if [ ! -f "$GCC" ]; then
            echo "ERROR: AArch64 GCC was not found."

            find "$TOOLCHAIN" \
              -name "aarch64-linux-android-gcc" \
              -type f \
              -print

            exit 1
          fi

          chmod +x "$GCC"

          echo "===== AArch64 GCC ====="
          "$GCC" --version

      - name: Verify ARM32 compatibility compiler
        run: |
          echo "===== ARM32 GCC ====="

          which arm-linux-gnueabi-gcc
          arm-linux-gnueabi-gcc --version

          which arm-linux-gnueabi-ld
          arm-linux-gnueabi-ld --version

      - name: Download Proton Clang
        run: |
          rm -rf "$GITHUB_WORKSPACE/proton-clang"

          git clone \
            --depth=1 \
            https://github.com/kdrag0n/proton-clang.git \
            "$GITHUB_WORKSPACE/proton-clang"

      - name: Verify Proton Clang
        run: |
          PROTON="$GITHUB_WORKSPACE/proton-clang"

          if [ ! -x "$PROTON/bin/clang" ]; then
            echo "ERROR: Proton Clang was not found."
            exit 1
          fi

          echo "===== Proton Clang ====="
          "$PROTON/bin/clang" --version

          echo ""
          echo "===== Test -fstack-protector-strong ====="

          echo 'int main(void) { return 0; }' > /tmp/test.c

          "$PROTON/bin/clang" \
            -target aarch64-linux-android \
            -fstack-protector-strong \
            -c /tmp/test.c \
            -o /tmp/test.o

          echo "Clang accepts -fstack-protector-strong"

      - name: Check A70Q defconfig
        run: |
          if [ ! -f "arch/arm64/configs/a70q_defconfig" ]; then
            echo "ERROR: a70q_defconfig not found."

            echo ""
            echo "Available A70 configs:"

            find arch/arm64/configs \
              -maxdepth 1 \
              -type f \
              -iname "*a70*" \
              | sort

            exit 1
          fi

          echo "Found a70q_defconfig"

      - name: Check DTC
        run: |
          if [ ! -e "$GITHUB_WORKSPACE/tools/dtc" ]; then
            echo "ERROR: tools/dtc not found."
            exit 1
          fi

          echo "DTC found."

      - name: Prepare output
        run: |
          rm -rf out
          mkdir -p out

      - name: Generate A70Q defconfig
        run: |
          TOOLCHAIN="$GITHUB_WORKSPACE/../PLATFORM/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"

          GCC="$TOOLCHAIN/bin/aarch64-linux-android-"

          COMPAT="/usr/bin/arm-linux-gnueabi-"

          PROTON="$GITHUB_WORKSPACE/proton-clang"

          make -C "$GITHUB_WORKSPACE" \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            CROSS_COMPILE="$GCC" \
            CROSS_COMPILE_COMPAT="$COMPAT" \
            CC="$PROTON/bin/clang" \
            REAL_CC="$PROTON/bin/clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            DTC_EXT="$GITHUB_WORKSPACE/tools/dtc" \
            CONFIG_BUILD_ARM64_DT_OVERLAY=y \
            a70q_defconfig

      - name: Configure kernel
        run: |
          CONFIG="$GITHUB_WORKSPACE/out/.config"

          if [ ! -f "$CONFIG" ]; then
            echo "ERROR: out/.config was not generated."
            exit 1
          fi

          sed -i '/^CONFIG_MODULE_SIG_FORCE=/d' "$CONFIG"
          sed -i '/^# CONFIG_MODULE_SIG_FORCE is not set$/d' "$CONFIG"
          echo "# CONFIG_MODULE_SIG_FORCE is not set" >> "$CONFIG"

          sed -i '/^CONFIG_SAMSUNG_TIMA=/d' "$CONFIG"
          sed -i '/^# CONFIG_SAMSUNG_TIMA is not set$/d' "$CONFIG"
          echo "# CONFIG_SAMSUNG_TIMA is not set" >> "$CONFIG"

          sed -i '/^CONFIG_MODULES=/d' "$CONFIG"
          echo "CONFIG_MODULES=y" >> "$CONFIG"

          sed -i '/^CONFIG_MODULE_UNLOAD=/d' "$CONFIG"
          echo "CONFIG_MODULE_UNLOAD=y" >> "$CONFIG"

          TOOLCHAIN="$GITHUB_WORKSPACE/../PLATFORM/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"

          GCC="$TOOLCHAIN/bin/aarch64-linux-android-"

          COMPAT="/usr/bin/arm-linux-gnueabi-"

          PROTON="$GITHUB_WORKSPACE/proton-clang"

          make -C "$GITHUB_WORKSPACE" \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            CROSS_COMPILE="$GCC" \
            CROSS_COMPILE_COMPAT="$COMPAT" \
            CC="$PROTON/bin/clang" \
            REAL_CC="$PROTON/bin/clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            olddefconfig

          echo ""
          echo "===== Final kernel configuration ====="

          grep -E \
            'CONFIG_MODULES=|CONFIG_MODULE_UNLOAD=|CONFIG_MODULE_SIG_FORCE=|CONFIG_SAMSUNG_TIMA=|CONFIG_CC_STACKPROTECTOR_' \
            "$CONFIG" || true

      - name: Build kernel
        run: |
          TOOLCHAIN="$GITHUB_WORKSPACE/../PLATFORM/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"

          GCC="$TOOLCHAIN/bin/aarch64-linux-android-"

          COMPAT="/usr/bin/arm-linux-gnueabi-"

          PROTON="$GITHUB_WORKSPACE/proton-clang"

          echo "===== Build variables ====="
          echo "CROSS_COMPILE=$GCC"
          echo "CROSS_COMPILE_COMPAT=$COMPAT"
          echo "CC=$PROTON/bin/clang"
          echo "REAL_CC=$PROTON/bin/clang"
          echo "CLANG_TRIPLE=aarch64-linux-gnu-"

          make -j"$(nproc)" \
            -C "$GITHUB_WORKSPACE" \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            CROSS_COMPILE="$GCC" \
            CROSS_COMPILE_COMPAT="$COMPAT" \
            CC="$PROTON/bin/clang" \
            REAL_CC="$PROTON/bin/clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            DTC_EXT="$GITHUB_WORKSPACE/tools/dtc" \
            CONFIG_BUILD_ARM64_DT_OVERLAY=y

      - name: Build device trees
        run: |
          TOOLCHAIN="$GITHUB_WORKSPACE/../PLATFORM/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"

          GCC="$TOOLCHAIN/bin/aarch64-linux-android-"

          COMPAT="/usr/bin/arm-linux-gnueabi-"

          PROTON="$GITHUB_WORKSPACE/proton-clang"

          make -j"$(nproc)" \
            -C "$GITHUB_WORKSPACE" \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            CROSS_COMPILE="$GCC" \
            CROSS_COMPILE_COMPAT="$COMPAT" \
            CC="$PROTON/bin/clang" \
            REAL_CC="$PROTON/bin/clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            DTC_EXT="$GITHUB_WORKSPACE/tools/dtc" \
            CONFIG_BUILD_ARM64_DT_OVERLAY=y \
            dtbs

      - name: Verify kernel and DTB
        run: |
          IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image"

          DTB="$GITHUB_WORKSPACE/out/arch/arm64/boot/dts/qcom/sm6150.dtb"

          if [ ! -f "$IMAGE" ]; then
            echo "ERROR: Image was not produced."
            exit 1
          fi

          if [ ! -f "$DTB" ]; then
            echo "ERROR: sm6150.dtb was not produced."
            exit 1
          fi

          echo "===== Kernel ====="
          ls -lh "$IMAGE"

          echo ""
          echo "===== DTB ====="
          ls -lh "$DTB"

          echo ""
          echo "===== Boot directory ====="
          find "$GITHUB_WORKSPACE/out/arch/arm64/boot" \
            -maxdepth 3 \
            -type f \
            -printf '%p (%s bytes)\n' \
            | sort

      - name: Download AnyKernel3
        run: |
          rm -rf "$GITHUB_WORKSPACE/AnyKernel3"

          git clone \
            --depth=1 \
            https://github.com/KernelSU-Next/AnyKernel3.git \
            "$GITHUB_WORKSPACE/AnyKernel3"

      - name: Prepare AnyKernel3
        run: |
          set -e

          AK3="$GITHUB_WORKSPACE/AnyKernel3"

          IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image"

          DTB="$GITHUB_WORKSPACE/out/arch/arm64/boot/dts/qcom/sm6150.dtb"

          test -s "$IMAGE"
          test -s "$DTB"

          echo "===== AK3 source ====="
          ls -lah "$AK3"

          echo ""
          echo "===== Kernel image ====="
          ls -lh "$IMAGE"

          echo ""
          echo "===== DTB ====="
          ls -lh "$DTB"

          # Use the kernel image directly.
          cp "$IMAGE" "$AK3/Image"

          # Keep the DTB separate so the installer can handle it.
          cp "$DTB" "$AK3/dtb"

          # Remove unnecessary repository metadata.
          rm -rf "$AK3/.git"

          echo ""
          echo "===== AK3 package contents ====="
          ls -lah "$AK3"

      - name: Create A70Q Kernel ZIP
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/AnyKernel3"

          zip -r9 \
            "$GITHUB_WORKSPACE/A70Q-Cartel-Kernel.zip" \
            . \
            -x "*.git*" \
            -x "README.md"

          echo ""
          echo "===== Final kernel ZIP ====="

          ls -lh \
            "$GITHUB_WORKSPACE/A70Q-Cartel-Kernel.zip"

      - name: Verify final ZIP
        run: |
          unzip -l "$GITHUB_WORKSPACE/A70Q-Cartel-Kernel.zip"

      - name: Upload flashable kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: A70Q-Cartel-Kernel-ZIP
          path: |
            A70Q-Cartel-Kernel.zip
            out/.config
