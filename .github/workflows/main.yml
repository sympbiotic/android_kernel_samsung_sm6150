name: A70Q Cartel Kernel Build

on:
  push:
    branches:
      - lineage-22.1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            libelf-dev \
            libncurses5-dev \
            python3 \
            git \
            curl \
            ccache

      - name: Prepare GCC directory
        run: |
          TOOLCHAIN="$GITHUB_WORKSPACE/../PLATFORM/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"

          rm -rf "$TOOLCHAIN"

          mkdir -p "$(dirname "$TOOLCHAIN")"

          echo "GCC directory:"
          echo "$TOOLCHAIN"

      - name: Clone Android GCC 4.9
        run: |
          TOOLCHAIN="$GITHUB_WORKSPACE/../PLATFORM/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"

          git clone \
            --depth=1 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            "$TOOLCHAIN"

      - name: Verify GCC installation
        run: |
          TOOLCHAIN="$GITHUB_WORKSPACE/../PLATFORM/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"

          echo "===== GCC directory ====="
          ls -la "$TOOLCHAIN"

          echo ""
          echo "===== GCC bin directory ====="
          ls -la "$TOOLCHAIN/bin"

          echo ""
          echo "===== GCC compiler ====="

          GCC="$TOOLCHAIN/bin/aarch64-linux-android-gcc"

          if [ ! -f "$GCC" ]; then
            echo "ERROR: GCC compiler was not found:"
            echo "$GCC"
            echo ""
            echo "Searching for aarch64-linux-android-gcc..."
            find "$TOOLCHAIN" -name "aarch64-linux-android-gcc" -type f -print
            exit 1
          fi

          chmod +x "$GCC"

          "$GCC" --version

      - name: Check kernel source
        run: |
          echo "===== Kernel source ====="
          pwd

          echo ""
          echo "===== Defconfig ====="

          if [ ! -f "arch/arm64/configs/a70q_eur_open_defconfig" ]; then
            echo "ERROR: a70q_eur_open_defconfig was not found."

            echo ""
            echo "Available A70Q configs:"
            find arch/arm64/configs -type f \
              \( -iname "*a70*" -o -iname "*q*" \) \
              | sort

            exit 1
          fi

          echo "Found:"
          echo "arch/arm64/configs/a70q_eur_open_defconfig"

      - name: Check Clang
        run: |
          CLANG="$GITHUB_WORKSPACE/toolchain/llvm-arm-toolchain-ship/10.0/bin/clang"

          if [ ! -f "$CLANG" ]; then
            echo "ERROR: Clang 10 was not found:"
            echo "$CLANG"
            exit 1
          fi

          chmod +x "$CLANG"

          "$CLANG" --version

      - name: Prepare build directory
        run: |
          rm -rf out
          mkdir -p out

      - name: Generate kernel configuration
        run: |
          TOOLCHAIN="$GITHUB_WORKSPACE/../PLATFORM/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"

          GCC="$TOOLCHAIN/bin/aarch64-linux-android-"

          CLANG="$GITHUB_WORKSPACE/toolchain/llvm-arm-toolchain-ship/10.0/bin/clang"

          make -C "$GITHUB_WORKSPACE" \
            O="$GITHUB_WORKSPACE/out" \
            DTC_EXT="$GITHUB_WORKSPACE/tools/dtc" \
            CONFIG_BUILD_ARM64_DT_OVERLAY=y \
            ARCH=arm64 \
            CROSS_COMPILE="$GCC" \
            REAL_CC="$CLANG" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            a70q_eur_open_defconfig

      - name: Disable forced module verification
        run: |
          CONFIG="$GITHUB_WORKSPACE/out/.config"

          if [ ! -f "$CONFIG" ]; then
            echo "ERROR: out/.config was not generated."
            exit 1
          fi

          sed -i '/^CONFIG_MODULE_SIG_FORCE=/d' "$CONFIG"
          sed -i '/^# CONFIG_MODULE_SIG_FORCE is not set$/d' "$CONFIG"
          echo "# CONFIG_MODULE_SIG_FORCE is not set" >> "$CONFIG"

          sed -i '/^CONFIG_SAMSUNG_TIMA=/d' "$CONFIG"
          sed -i '/^# CONFIG_SAMSUNG_TIMA is not set$/d' "$CONFIG"
          echo "# CONFIG_SAMSUNG_TIMA is not set" >> "$CONFIG"

          if ! grep -q '^CONFIG_MODULES=y' "$CONFIG"; then
            echo "CONFIG_MODULES=y" >> "$CONFIG"
          fi

          if ! grep -q '^CONFIG_MODULE_UNLOAD=y' "$CONFIG"; then
            echo "CONFIG_MODULE_UNLOAD=y" >> "$CONFIG"
          fi

          make -C "$GITHUB_WORKSPACE" \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            olddefconfig

          echo ""
          echo "===== Final configuration ====="

          grep -E \
            'CONFIG_MODULES=|CONFIG_MODULE_UNLOAD=|CONFIG_MODULE_SIG_FORCE=|CONFIG_SAMSUNG_TIMA=' \
            "$CONFIG" || true

      - name: Build kernel
        run: |
          TOOLCHAIN="$GITHUB_WORKSPACE/../PLATFORM/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"

          GCC="$TOOLCHAIN/bin/aarch64-linux-android-"

          CLANG="$GITHUB_WORKSPACE/toolchain/llvm-arm-toolchain-ship/10.0/bin/clang"

          make -j"$(nproc)" \
            -C "$GITHUB_WORKSPACE" \
            O="$GITHUB_WORKSPACE/out" \
            DTC_EXT="$GITHUB_WORKSPACE/tools/dtc" \
            CONFIG_BUILD_ARM64_DT_OVERLAY=y \
            ARCH=arm64 \
            CROSS_COMPILE="$GCC" \
            REAL_CC="$CLANG" \
            CLANG_TRIPLE=aarch64-linux-gnu-

      - name: Verify kernel image
        run: |
          IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image"

          if [ ! -f "$IMAGE" ]; then
            echo "ERROR: Kernel Image was not produced."

            echo ""
            echo "Contents of out/arch/arm64/boot:"
            ls -lah "$GITHUB_WORKSPACE/out/arch/arm64/boot" || true

            exit 1
          fi

          echo "===== Kernel ====="
          ls -lh "$IMAGE"

          echo ""
          echo "===== File information ====="
          file "$IMAGE"

      - name: Copy kernel Image
        run: |
          cp \
            "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image" \
            "$GITHUB_WORKSPACE/arch/arm64/boot/Image"

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: A70Q-Cartel-Kernel
          path: |
            arch/arm64/boot/Image
            out/.config
