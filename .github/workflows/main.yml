
name: A70Q Cartel Kernel Build

on:
  push:
    branches:
      - lineage-22.1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential \
            libssl-dev libelf-dev libncurses5-dev \
            python3 git curl wget xz-utils ccache zip \
            gcc-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi

      - name: Prepare GCC 4.9 directory
        run: |
          TOOLCHAIN="$GITHUB_WORKSPACE/../PLATFORM/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"
          rm -rf "$TOOLCHAIN"
          mkdir -p "$(dirname "$TOOLCHAIN")"

      - name: Download GCC 4.9
        run: |
          TOOLCHAIN="$GITHUB_WORKSPACE/../PLATFORM/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"

          git clone \
            --depth=1 \
            --branch android11-release \
            https://gitlab.com/pixelrom/kernel/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git \
            "$TOOLCHAIN"

      - name: Verify AArch64 GCC
        run: |
          TOOLCHAIN="$GITHUB_WORKSPACE/../PLATFORM/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"
          GCC="$TOOLCHAIN/bin/aarch64-linux-android-gcc"

          if [ ! -f "$GCC" ]; then
            echo "ERROR: AArch64 GCC not found"
            find "$TOOLCHAIN" -name "aarch64-linux-android-gcc"
            exit 1
          fi

          chmod +x "$GCC"
          "$GCC" --version

      - name: Verify ARM32 compatibility compiler
        run: |
          which arm-linux-gnueabi-gcc
          arm-linux-gnueabi-gcc --version
          which arm-linux-gnueabi-ld

      - name: Download Proton Clang
        run: |
          rm -rf "$GITHUB_WORKSPACE/proton-clang"

          git clone \
            --depth=1 \
            https://github.com/kdrag0n/proton-clang.git \
            "$GITHUB_WORKSPACE/proton-clang"

      - name: Verify Proton Clang
        run: |
          PROTON="$GITHUB_WORKSPACE/proton-clang"

          if [ ! -x "$PROTON/bin/clang" ]; then
            echo "ERROR: Proton Clang not found"
            exit 1
          fi

          "$PROTON/bin/clang" --version

          echo 'int main(void) { return 0; }' > /tmp/test.c

          "$PROTON/bin/clang" \
            -target aarch64-linux-android \
            -fstack-protector-strong \
            -c /tmp/test.c \
            -o /tmp/test.o

      - name: Check A70Q defconfig
        run: |
          test -f arch/arm64/configs/a70q_defconfig || {
            echo "ERROR: a70q_defconfig not found"
            find arch/arm64/configs -iname "*a70*"
            exit 1
          }

      - name: Check DTC
        run: |
          test -e "$GITHUB_WORKSPACE/tools/dtc" || {
            echo "ERROR: tools/dtc not found"
            exit 1
          }

      - name: Prepare output
        run: |
          rm -rf out
          mkdir -p out

      - name: Generate A70Q defconfig
        run: |
          TOOLCHAIN="$GITHUB_WORKSPACE/../PLATFORM/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"
          GCC="$TOOLCHAIN/bin/aarch64-linux-android-"
          COMPAT="/usr/bin/arm-linux-gnueabi-"
          PROTON="$GITHUB_WORKSPACE/proton-clang"

          make -C "$GITHUB_WORKSPACE" \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            CROSS_COMPILE="$GCC" \
            CROSS_COMPILE_COMPAT="$COMPAT" \
            CC="$PROTON/bin/clang" \
            REAL_CC="$PROTON/bin/clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            DTC_EXT="$GITHUB_WORKSPACE/tools/dtc" \
            CONFIG_BUILD_ARM64_DT_OVERLAY=y \
            a70q_defconfig

      - name: Configure kernel
        run: |
          CONFIG="$GITHUB_WORKSPACE/out/.config"

          test -f "$CONFIG" || {
            echo "ERROR: Kernel config missing"
            exit 1
          }

          sed -i '/^CONFIG_MODULE_SIG_FORCE=/d' "$CONFIG"
          sed -i '/^# CONFIG_MODULE_SIG_FORCE is not set$/d' "$CONFIG"
          echo "# CONFIG_MODULE_SIG_FORCE is not set" >> "$CONFIG"

          sed -i '/^CONFIG_SAMSUNG_TIMA=/d' "$CONFIG"
          sed -i '/^# CONFIG_SAMSUNG_TIMA is not set$/d' "$CONFIG"
          echo "# CONFIG_SAMSUNG_TIMA is not set" >> "$CONFIG"

          sed -i '/^CONFIG_MODULES=/d' "$CONFIG"
          echo "CONFIG_MODULES=y" >> "$CONFIG"

          sed -i '/^CONFIG_MODULE_UNLOAD=/d' "$CONFIG"
          echo "CONFIG_MODULE_UNLOAD=y" >> "$CONFIG"

          TOOLCHAIN="$GITHUB_WORKSPACE/../PLATFORM/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"
          GCC="$TOOLCHAIN/bin/aarch64-linux-android-"
          COMPAT="/usr/bin/arm-linux-gnueabi-"
          PROTON="$GITHUB_WORKSPACE/proton-clang"

          make -C "$GITHUB_WORKSPACE" \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            CROSS_COMPILE="$GCC" \
            CROSS_COMPILE_COMPAT="$COMPAT" \
            CC="$PROTON/bin/clang" \
            REAL_CC="$PROTON/bin/clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            olddefconfig

          echo "===== Final config ====="
          grep -E \
            'CONFIG_MODULES=|CONFIG_MODULE_UNLOAD=|CONFIG_MODULE_SIG_FORCE=|CONFIG_SAMSUNG_TIMA=' \
            "$CONFIG" || true

      - name: Build kernel
        run: |
          TOOLCHAIN="$GITHUB_WORKSPACE/../PLATFORM/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"
          GCC="$TOOLCHAIN/bin/aarch64-linux-android-"
          COMPAT="/usr/bin/arm-linux-gnueabi-"
          PROTON="$GITHUB_WORKSPACE/proton-clang"

          make -j"$(nproc)" \
            -C "$GITHUB_WORKSPACE" \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            CROSS_COMPILE="$GCC" \
            CROSS_COMPILE_COMPAT="$COMPAT" \
            CC="$PROTON/bin/clang" \
            REAL_CC="$PROTON/bin/clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            DTC_EXT="$GITHUB_WORKSPACE/tools/dtc" \
            CONFIG_BUILD_ARM64_DT_OVERLAY=y

      - name: Build device trees
        run: |
          TOOLCHAIN="$GITHUB_WORKSPACE/../PLATFORM/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"
          GCC="$TOOLCHAIN/bin/aarch64-linux-android-"
          COMPAT="/usr/bin/arm-linux-gnueabi-"
          PROTON="$GITHUB_WORKSPACE/proton-clang"

          make -j"$(nproc)" \
            -C "$GITHUB_WORKSPACE" \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            CROSS_COMPILE="$GCC" \
            CROSS_COMPILE_COMPAT="$COMPAT" \
            CC="$PROTON/bin/clang" \
            REAL_CC="$PROTON/bin/clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            DTC_EXT="$GITHUB_WORKSPACE/tools/dtc" \
            CONFIG_BUILD_ARM64_DT_OVERLAY=y \
            dtbs

      - name: Inspect kernel and DTB outputs
        run: |
          echo "===== Boot outputs ====="

          find out/arch/arm64/boot \
            -type f \
            -printf '%p (%s bytes)\n' | sort

          echo ""
          echo "===== A70Q DTBs ====="

          find out/arch/arm64/boot \
            -type f -iname '*a70q*.dtb' \
            -print

      - name: Download A70Q AnyKernel3
        run: |
          git clone \
            --depth=1 \
            --branch lineage-17.1 \
            https://github.com/sm7150/a70qkernel.git \
            "$GITHUB_WORKSPACE/a70q-legacy"

          test -f "$GITHUB_WORKSPACE/a70q-legacy/AnyKernel3/anykernel.sh"
          test -f "$GITHUB_WORKSPACE/a70q-legacy/AnyKernel3/tools/ak3-core.sh"

          cp -a \
            "$GITHUB_WORKSPACE/a70q-legacy/AnyKernel3" \
            "$GITHUB_WORKSPACE/AnyKernel3"

      - name: Prepare AnyKernel3 package
        run: |
          set -e

          IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image"
          AK3="$GITHUB_WORKSPACE/AnyKernel3"
          BOOT="$GITHUB_WORKSPACE/out/arch/arm64/boot"

          test -s "$IMAGE" || {
            echo "ERROR: Kernel Image missing"
            exit 1
          }

          mapfile -t DTBS < <(
            find "$BOOT" -type f -iname '*a70q*.dtb' | sort
          )

          if [ "${#DTBS[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one A70Q DTB."
            echo "Found ${#DTBS[@]} matching files."
            echo ""
            echo "All available DTBs:"
            find "$BOOT" -type f -name '*.dtb' -print
            exit 1
          fi

          echo "Selected DTB: ${DTBS[0]}"

          # Remove any old kernel payloads from the template.
          rm -f "$AK3"/Image \
                "$AK3"/Image.gz \
                "$AK3"/Image.gz-dtb \
                "$AK3"/Image-dtb \
                "$AK3"/zImage \
                "$AK3"/zImage-dtb

          # Create compressed kernel + appended A70Q DTB.
          gzip -n -c "$IMAGE" > "$AK3/Image.gz-dtb"
          cat "${DTBS[0]}" >> "$AK3/Image.gz-dtb"

          # Include DTBO only when a single built dtbo.img exists.
          mapfile -t DTBOS < <(
            find "$GITHUB_WORKSPACE/out" \
              -type f -name 'dtbo.img' | sort
          )

          if [ "${#DTBOS[@]}" -gt 1 ]; then
            echo "ERROR: Multiple dtbo.img files found."
            printf '%s\n' "${DTBOS[@]}"
            exit 1
          elif [ "${#DTBOS[@]}" -eq 1 ]; then
            cp "${DTBOS[0]}" "$AK3/dtbo.img"
            echo "Included DTBO: ${DTBOS[0]}"
          else
            echo "No separate dtbo.img found."
          fi

          # Enable a device check in the legacy A70Q installer.
          sed -i \
            's/^do.devicecheck=0$/do.devicecheck=1/' \
            "$AK3/anykernel.sh"

          sed -i \
            's/^device.name1=$/device.name1=a70q/' \
            "$AK3/anykernel.sh"

          echo ""
          echo "===== Package contents ====="
          ls -lh "$AK3"

          echo ""
          echo "===== Installer device settings ====="
          grep -E 'do.devicecheck|device.name1|block=|is_slot_device' \
            "$AK3/anykernel.sh"

      - name: Create A70Q kernel ZIP
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/AnyKernel3"

          zip -r9 \
            "$GITHUB_WORKSPACE/A70Q-Cartel-Kernel.zip" \
            . \
            -x ".git/*"

          test -s "$GITHUB_WORKSPACE/A70Q-Cartel-Kernel.zip"

          echo "===== Final ZIP ====="
          ls -lh "$GITHUB_WORKSPACE/A70Q-Cartel-Kernel.zip"

      - name: Upload flashable package candidate
        uses: actions/upload-artifact@v4
        with:
          name: A70Q-Cartel-Kernel-ZIP
          path: |
            A70Q-Cartel-Kernel.zip
            out/.config
